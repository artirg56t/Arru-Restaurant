<html>

    .form-box {

      border-radius: 10px;

    h2 {
      text-align: center;
    }
    label {

    }
    input[type="text"],

    input[type="number"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .group-label {
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
    .checkbox-group {

    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
